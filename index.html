<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة اليعسوب لعرض إبداعات الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#1F4FD8; --navy:#0B1F4B; --deep:#123A8F; --gold:#C9A227; --gold-l:#F6E7A8; --bg:#F3F5F9; --card:#fff;
  --ink:#16233F; --muted:#5E6B85; --line:#DDE3EF; --ice:#E8EEFC;
  --title:'Amiri',serif; --sub:'Aref Ruqaa',cursive; --body:'Noto Naskh Arabic',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.9;font-size:17px}
body.locked{overflow:hidden}
body.locked #app{display:none}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-weight:400}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:9px 22px;cursor:pointer;font-weight:600;background:var(--royal);color:#fff;transition:background .2s}
.btn:hover{background:var(--navy)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gold:hover{background:#B38F1A}
.btn.line{background:#fff;color:var(--royal);border:1.5px solid var(--royal)}
.btn.line:hover{background:var(--ice)}
.btn.wa{background:#1FA855}
.btn.wa:hover{background:#16813F}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* gate */
#gate{position:fixed;inset:0;z-index:100;overflow:auto;background:linear-gradient(155deg,var(--navy),var(--deep) 60%,var(--royal));display:grid;place-items:center;padding:24px}
#gate[hidden]{display:none}
.gbox{background:#fff;border-radius:24px;width:min(560px,100%);padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gbox .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin-bottom:18px}
.gbox h1{font-family:var(--title);font-weight:700;font-size:34px;color:var(--navy);line-height:1.4}
.gbox .brand p{color:var(--muted);font-size:15px}
.gbtn{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--ink);gap:12px}
.gbtn:hover{background:var(--bg)}
.gbtn.ok{border-color:#1FA855;background:#EAF8F0}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:16px 0 6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fg .full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 2px;color:var(--navy)}
input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--bg)}
input:focus,select:focus{outline:none;border-color:var(--royal);background:#fff}
.codebox{margin-top:14px;padding:14px;background:var(--ice);border-radius:14px}
.codebox[hidden]{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.err{color:#B3261E;font-size:14px;min-height:22px;margin-top:8px}
.hint{font-size:13px;color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 2px 14px rgba(11,31,75,.25)}
.bar{display:flex;align-items:center;gap:16px;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--title);font-weight:700;font-size:24px;white-space:nowrap}
.logo svg{width:42px;height:42px;flex:none}
.hs{flex:1;max-width:420px;margin-inline:auto;position:relative}
.hs input{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:99px;padding-inline:20px}
.hs input::placeholder{color:#B8C6EA}
.hs input:focus{background:#fff;color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.4}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-family:var(--sub);flex:none}
.me small{display:block;color:#B8C6EA}
.out{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:2px 14px;cursor:pointer;font-size:13px}
.out:hover{background:rgba(255,255,255,.12)}

/* hero */
.hero{background:linear-gradient(160deg,var(--deep),var(--royal));color:#fff;padding:46px 0 54px}
.hero h1{font-family:var(--title);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1.4}
.hero p{font-family:var(--sub);font-size:clamp(18px,2.4vw,24px);color:var(--gold-l);margin-top:4px}

/* sections */
section{padding:46px 0 6px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sh h2{font-family:var(--sub);font-weight:700;font-size:30px;color:var(--navy)}
.sh span{color:var(--muted);font-size:15px}

/* winners */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.win{position:relative;background:linear-gradient(180deg,#FFFBEA,#fff 45%);border:2px solid var(--gold);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:start;padding:0;box-shadow:0 10px 28px rgba(201,162,39,.18)}
.win .thumb{height:150px}
.medal{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--gold-l);border-radius:99px;padding:3px 14px 3px 6px;font-weight:700;font-size:14px;z-index:2}
.medal b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF1B0,var(--gold));color:var(--navy);font-family:var(--title);font-size:17px}
.win.r2 .medal b{background:radial-gradient(circle at 35% 30%,#fff,#B9C2D3)}
.win.r3 .medal b{background:radial-gradient(circle at 35% 30%,#F4D0A8,#B87333)}
.win .body{padding:16px 20px 20px}
.award{font-family:var(--sub);color:#8A6D0B;font-size:16px}

/* years */
.ygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.ycard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:2px}
.ycard:hover,.ycard[aria-pressed=true]{border-color:var(--royal);background:var(--ice);transform:translateY(-3px)}
.ycard[aria-pressed=true]{box-shadow:0 8px 20px rgba(31,79,216,.18)}
.yn{width:54px;height:54px;border-radius:16px;background:var(--navy);color:var(--gold-l);display:grid;place-items:center;font-family:var(--title);font-weight:700;font-size:30px;margin-bottom:6px}
.ycard h3{font-family:var(--sub);font-weight:700;font-size:19px;color:var(--navy);line-height:1.5}
.ycard span{font-size:14px;color:var(--muted)}

/* filter */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:2px 18px;cursor:pointer;font-weight:500;color:var(--muted)}
.chip:hover{border-color:var(--royal);color:var(--royal)}
.chip[aria-pressed=true]{background:var(--royal);border-color:var(--royal);color:#fff}
.fbar .sep{width:1px;height:26px;background:var(--line);margin-inline:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;padding-bottom:60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,31,75,.12)}
.thumb{height:168px;background:linear-gradient(135deg,var(--ice),#9DB6F2);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:64px;opacity:.55}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;border-radius:99px;padding:0 12px;background:var(--ice);color:var(--deep)}
.tag.t{background:#FFF6D6;color:#7A5F00}
.body h3{font-family:var(--sub);font-weight:700;font-size:20px;line-height:1.6;color:var(--navy)}
.by{color:var(--muted);font-size:15px}
.body .btn{margin-top:auto;padding:6px 16px}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--muted)}

/* modal */
dialog{border:0;border-radius:22px;padding:0;width:min(640px,92vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(11,31,75,.4)}
dialog::backdrop{background:rgba(11,31,75,.6)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 28px 0}
.dh h3{font-family:var(--sub);font-weight:700;font-size:26px;color:var(--navy);line-height:1.6}
.x{border:0;background:var(--ice);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:22px;color:var(--royal);flex:none}
.db{padding:10px 28px 28px}
.db .thumb{border-radius:14px;margin:10px 0 14px}
.db p{white-space:pre-line}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 24px;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
footer{background:var(--navy);color:#B8C6EA;text-align:center;padding:26px 0;font-size:15px}

@media(max-width:900px){.ygrid{grid-template-columns:repeat(3,1fr)}.me div{display:none}}
@media(max-width:620px){.fg{grid-template-columns:1fr}.ygrid{grid-template-columns:repeat(2,1fr)}.bar{height:auto;flex-wrap:wrap;padding:10px 0}.hs{order:3;max-width:none;flex-basis:100%}.logo{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fly" viewBox="0 0 64 64">
    <g fill="currentColor"><ellipse cx="18" cy="22" rx="16" ry="6" transform="rotate(-18 18 22)"/><ellipse cx="46" cy="22" rx="16" ry="6" transform="rotate(18 46 22)"/><ellipse cx="20" cy="33" rx="14" ry="5" transform="rotate(14 20 33)" opacity=".75"/><ellipse cx="44" cy="33" rx="14" ry="5" transform="rotate(-14 44 33)" opacity=".75"/><rect x="29" y="12" width="6" height="46" rx="3"/><circle cx="32" cy="11" r="5"/></g>
  </symbol>
</svg>

<div id="app">
<header>
  <div class="wrap bar">
    <a href="#top" class="logo"><svg style="color:var(--gold)"><use href="#fly"/></svg>اليعسوب</a>
    <div class="hs"><input id="q" type="search" placeholder="ابحثي باسم الطالب أو عنوان الإبداع" aria-label="بحث"></div>
  </div>
</header>

<div class="hero" id="top"><div class="wrap">
  <h1>منصة اليعسوب لعرض إبداعات الطلاب</h1>
  <p>كلية الصيدلة · تصاميم وأبحاث وفيديوهات ومبادرات</p>
</div></div>

<main class="wrap">
  <section id="winners">
    <div class="sh"><h2>الإبداعات الفائزة في مسابقات الجامعة</h2><span>أعمال حصدت مراكز متقدمة</span></div>
    <div class="wgrid" id="wgrid"></div>
  </section>

  <section id="years">
    <div class="sh"><h2>فرق الكلية</h2><span>اختاري فرقة لعرض أعمالها</span></div>
    <div class="ygrid" id="ygrid"></div>
  </section>

  <section id="works">
    <div class="sh"><h2>كل الإبداعات</h2><span id="count"></span></div>
    <div class="fbar" id="fbar"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer>منصة اليعسوب · كلية الصيدلة © <span id="yr"></span></footer>
</div>

<dialog id="dlg">
  <div class="dh"><h3 id="dT"></h3><button class="x" data-close aria-label="إغلاق">×</button></div>
  <div class="db" id="dB"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== إعدادات الربط ===== */
const SUPABASE_URL = "https://oibsajvayvflexhqwgwt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pYnNhanZheXZmbGV4aHF3Z3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTUxNjAsImV4cCI6MjEwODI3MTE2MH0.X0OW7016FvJlGaMvbHtnTUXNRt38ymnA5HCMdfiDeSk";
/* ======================== */

const YEARS = ["الفرقة الأولى","الفرقة الثانية","الفرقة الثالثة","الفرقة الرابعة","الفرقة الخامسة (فارم دي)"];
const YSHORT = ["الأولى","الثانية","الثالثة","الرابعة","الخامسة"];
const TYPES = {design:"تصميم",research:"بحث",video:"فيديو",initiative:"مبادرة"};
const DEMO = [
 {id:1,title:"بوستر التوعية بالاستخدام الآمن للمضادات الحيوية",student_name:"مريم خالد أحمد سالم",year:2,type:"design",description:"سلسلة تصاميم توعوية بألوان هادئة وخطوط عربية واضحة، عُرضت في ممرات الكلية.",award:1,award_title:"المركز الأول في مسابقة التصميم الجامعية"},
 {id:2,title:"استخلاص مضادات الأكسدة من قشور الرمان",student_name:"أحمد علي محمود حسن",year:4,type:"research",description:"بحث معملي يقارن ثلاث طرق للاستخلاص ويقيس نشاط المستخلص ضد الجذور الحرة.",award:2,award_title:"المركز الثاني في ملتقى البحث العلمي"},
 {id:3,title:"مبادرة «دوائي في أمان» لكبار السن",student_name:"نور إبراهيم سعيد فؤاد",year:5,type:"initiative",description:"حملة ميدانية لتنظيم أدوية كبار السن ومراجعة التداخلات الدوائية الشائعة.",award:3,award_title:"المركز الثالث في مسابقة المبادرات المجتمعية"},
 {id:4,title:"فيديو شرح آلية عمل الأنسولين",student_name:"يوسف حسن عادل رمضان",year:3,type:"video",description:"فيديو متحرك مدته ست دقائق يبسّط مسار الإشارة داخل الخلية."},
 {id:5,title:"جدول الجرعات المصوّر لدواء الأطفال",student_name:"ليلى سامي كمال نصر",year:1,type:"design",description:"إنفوجرافيك يوضح الفرق بين الجرعة بالوزن والجرعة بالعمر."},
 {id:6,title:"مراجعة منهجية لتفاعلات الأدوية مع الأعشاب",student_name:"هبة محمد طارق إسماعيل",year:5,type:"research",description:"مراجعة لأكثر من أربعين دراسة منشورة مع تصنيف درجة الخطورة."},
 {id:7,title:"مبادرة جمع الأدوية منتهية الصلاحية",student_name:"عمر خالد فتحي منصور",year:3,type:"initiative",description:"نقاط تجميع داخل الكلية وتسليمها لجهة معتمدة للتخلص الآمن."},
 {id:8,title:"فيديو تعريفي بأقسام الصيدلية المجتمعية",student_name:"سلمى وليد حسام عبده",year:2,type:"video",description:"جولة مصورة تعرّف الطلاب الجدد بأدوار الصيدلي داخل الصيدلية."}
];

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//i.test(u||"") ? u : "";
const toast = m => {const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),4200)};
let works=[], fy=0, ft="", term="";

/* ---------- المحتوى ---------- */
async function loadWorks(){
  if(!sb){works=DEMO;return draw()}
  const {data,error}=await sb.from("works").select("*").eq("status","approved").order("created_at",{ascending:false});
  if(error)toast("تعذّر تحميل الإبداعات");
  works=error?[]:data; draw();
}

function thumb(w){const u=url(w.image_url);return `<div class="thumb">${u?`<img src="${esc(u)}" alt="${esc(w.title)}" loading="lazy">`:'<svg style="color:#fff"><use href="#fly"/></svg>'}</div>`}
function btns(w){const f=url(w.file_url);return `<button class="btn" data-id="${esc(w.id)}">التفاصيل</button>`}

function draw(){
  const win = works.filter(w=>w.award).sort((a,b)=>a.award-b.award);
  $("winners").style.display = win.length?"":"none";
  $("wgrid").innerHTML = win.map(w=>`
    <button class="win r${w.award}" data-id="${esc(w.id)}">
      <span class="medal"><b>${w.award}</b>المركز ${["","الأول","الثاني","الثالث"][w.award]||w.award}</span>
      ${thumb(w)}
      <div class="body"><span class="award">${esc(w.award_title)}</span><h3>${esc(w.title)}</h3><span class="by">${esc(w.student_name)} · ${YSHORT[w.year-1]?"الفرقة "+YSHORT[w.year-1]:""}</span></div>
    </button>`).join("");

  $("ygrid").innerHTML = YEARS.map((y,i)=>{const n=works.filter(w=>w.year===i+1).length;
    return `<button class="ycard" data-y="${i+1}" aria-pressed="${fy===i+1}"><span class="yn">${i+1}</span><h3>${y.replace(" (فارم دي)","")}</h3><span>${i===4?"فارم دي · ":""}${n} عمل</span></button>`}).join("");

  $("fbar").innerHTML = `<button class="chip" data-fy="0" aria-pressed="${!fy}">كل الفرق</button>`
    + YSHORT.map((y,i)=>`<button class="chip" data-fy="${i+1}" aria-pressed="${fy===i+1}">${y}</button>`).join("")
    + `<span class="sep"></span><button class="chip" data-ft="" aria-pressed="${!ft}">كل الأنواع</button>`
    + Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-ft="${k}" aria-pressed="${ft===k}">${v}</button>`).join("");

  const list = works.filter(w=>(!fy||w.year===fy)&&(!ft||w.type===ft)&&(!term||[w.title,w.student_name,w.description].join(" ").includes(term)));
  $("count").textContent = list.length+" عمل";
  $("grid").innerHTML = list.length ? list.map(w=>`
    <article class="card">${thumb(w)}
      <div class="body">
        <div class="tags"><span class="tag">${YSHORT[w.year-1]?"الفرقة "+YSHORT[w.year-1]:""}</span><span class="tag ${w.award?"t":""}">${esc(TYPES[w.type]||w.type)}</span></div>
        <h3>${esc(w.title)}</h3><div class="by">${esc(w.student_name)}</div>
        ${btns(w)}
      </div></article>`).join("") : '<div class="empty">لا توجد أعمال مطابقة. جرّبي فرقة أو نوعاً آخر.</div>';
}

document.addEventListener("click",e=>{
  const t=e.target;
  const y=t.closest("[data-y]"); if(y){fy=fy===+y.dataset.y?0:+y.dataset.y;draw();$("works").scrollIntoView();return}
  const cf=t.closest("[data-fy]"); if(cf){fy=+cf.dataset.fy;draw();return}
  const ct=t.closest("[data-ft]"); if(ct){ft=ct.dataset.ft;draw();return}
  const d=t.closest("[data-id]"); if(d){open(d.dataset.id);return}
});
$("q").addEventListener("input",e=>{term=e.target.value.trim();draw()});

function open(id){
  const w=works.find(x=>String(x.id)===String(id)); if(!w)return;
  const f=url(w.file_url);
  $("dT").textContent=w.title;
  $("dB").innerHTML=`${thumb(w)}
    <div class="tags" style="margin-bottom:10px"><span class="tag">${YEARS[w.year-1]||""}</span><span class="tag t">${esc(TYPES[w.type]||w.type)}</span>${w.award?`<span class="tag t">${esc(w.award_title)}</span>`:""}</div>
    <p>${esc(w.description)}</p>
    <p class="by" style="margin-top:12px">إعداد: ${esc(w.student_name)}</p>
    ${f?`<a class="btn gold" style="margin-top:16px" href="${esc(f)}" target="_blank" rel="noopener noreferrer" download>تحميل العمل</a>`:'<p class="hint" style="margin-top:14px">لا يوجد ملف للتحميل لهذا العمل.</p>'}`;
  $("dlg").showModal();
}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("dlg").close());
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});

$("yr").textContent=new Date().getFullYear();
loadWorks();
</script>
</body>
</html>
